<!DOCTYPE html>
<html lang="ru" data-font="standard">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Старославянский переводчик</title>
  <meta name="description" content="Переводчик и словарь старославянского языка: слова и предложения, слова под титлом, словарная статья с грамматикой.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%232563EB'/%3E%3Ctext x='16' y='24' font-size='22' text-anchor='middle' fill='white' font-family='sans-serif'%3E%D1%A2%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Monomakh&family=Noto+Sans:wght@400;600&display=swap">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <h1 class="brand">Старославянский переводчик</h1>
      <label class="font-switch">
        <span>Шрифт</span>
        <select id="font" aria-label="Шрифт старославянского текста">
          <option value="standard">Стандартный</option>
          <option value="monomakh">Исторический (Monomakh)</option>
          <option value="ponomar">Исторический (Ponomar)</option>
        </select>
      </label>
    </div>
  </header>

  <main class="wrap">
    <section class="translator" aria-label="Переводчик">
      <div class="panel" id="panel-src">
        <div class="panel-head">
          <span class="lang" id="src-label">Старославянский</span>
          <button type="button" class="tool" id="clear" title="Очистить" aria-label="Очистить">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
        </div>
        <div class="field">
          <textarea id="src" rows="6" spellcheck="false" autocomplete="off" autocapitalize="off" aria-label="Исходный текст"></textarea>
          <ul id="suggest" class="suggest" role="listbox" hidden></ul>
        </div>
        <div class="panel-foot" id="kbd-wrap">
          <button type="button" class="kbd-toggle" id="kbd-toggle" aria-expanded="true" aria-controls="kbd">
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Спецсимволы
          </button>
          <div class="kbd" id="kbd" role="group" aria-label="Спецсимволы старославянской кириллицы"></div>
        </div>
      </div>

      <button type="button" class="swap" id="swap" title="Поменять направление" aria-label="Поменять направление перевода">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M7 7h12m0 0l-3-3m3 3l-3 3M17 17H5m0 0l3-3m-3 3l3 3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>

      <div class="panel panel-out" id="panel-dst">
        <div class="panel-head">
          <span class="lang" id="dst-label">Русский</span>
          <button type="button" class="tool" id="copy" title="Копировать перевод" aria-label="Копировать перевод">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
        </div>
        <div class="out" id="out" aria-live="polite"></div>
        <div class="panel-foot out-foot"><span id="status" role="status"></span></div>
      </div>
    </section>

    <section class="entry" aria-labelledby="entry-title">
      <h2 id="entry-title">Словарная статья и грамматика</h2>
      <div id="entry-body"></div>
    </section>
  </main>

  <footer class="wrap foot">
    <span id="stats"></span>
    <span>Пословный разбор без учёта грамматики. Данные словаря можно расширять: <code>public/data/dictionary.json</code></span>
  </footer>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
